services:
  db:
    image: postgres:15-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-SmartProd}
      POSTGRES_USER: ${POSTGRES_USER:-smartprod}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - smartprod-postgres:/var/lib/postgresql/data
      - ./db-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-smartprod} -d ${POSTGRES_DB:-SmartProd}"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./SmartProd
      dockerfile: SmartProd.Server/Dockerfile
    restart: unless-stopped
    environment:
      ASPNETCORE_URLS: http://+:8080
      DB_CONNECTION_STRING: Host=db;Port=5432;Database=${POSTGRES_DB:-SmartProd};Username=${POSTGRES_USER:-smartprod};Password=${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in .env (at least 32 bytes)}
      Jwt__Issuer: ${JWT_ISSUER:-SmartProd}
      Jwt__ExpiresInDays: ${JWT_EXPIRES_IN_DAYS:-7}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost}
      ADMIN_INITIAL_EMAIL: ${ADMIN_INITIAL_EMAIL:?Set ADMIN_INITIAL_EMAIL in .env}
      ADMIN_INITIAL_PASSWORD: ${ADMIN_INITIAL_PASSWORD:?Set ADMIN_INITIAL_PASSWORD in .env (12+ characters)}
    ports:
      - "${BACKEND_PORT:-5481}:8080"
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build:
      context: ./SmartProd/frontend
      dockerfile: Dockerfile
      args:
        VITE_API_URL: ${VITE_API_URL:-}
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-80}:80"
    depends_on:
      - backend

volumes:
  smartprod-postgres:
